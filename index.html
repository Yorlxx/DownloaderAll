<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Downloader - Yorlxx Dev</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .loader-bar { width: 100%; height: 4px; background: #1e293b; overflow: hidden; border-radius: 2px; }
    .loader-bar::after { content: ''; display: block; width: 40%; height: 100%; background: #6366f1; animation: load 1s infinite ease-in-out; }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    
    /* Scrollbar personalizado para la galería */
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #0f172a; border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center p-4">

  <!-- Header -->
  <header class="text-center mt-8 mb-6">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-bold mb-4 uppercase tracking-widest">
      <i class="fa-solid fa-server"></i> Arquitectura Híbrida
    </div>
    <h1 class="text-4xl sm:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500">
      Social Downloader
    </h1>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl my-auto">
    
    <div class="flex justify-center gap-6 mb-6 text-slate-500">
      <i class="fa-brands fa-tiktok text-2xl hover:text-pink-500 transition-colors"></i>
      <i class="fa-brands fa-facebook text-2xl hover:text-blue-500 transition-colors"></i>
      <i class="fa-brands fa-instagram text-2xl hover:text-purple-500 transition-colors"></i>
    </div>

    <!-- Input Box -->
    <div class="mb-8">
      <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Enlace del Video o Fotos</label>
      <div class="relative flex items-center bg-slate-950 border border-slate-800 rounded-2xl focus-within:border-indigo-500 transition-all shadow-inner">
        <input type="text" id="urlInput" placeholder="Pega el link aquí..." class="w-full bg-transparent py-4 pl-4 pr-20 text-sm focus:outline-none text-slate-200">
        <div class="absolute right-2 flex items-center gap-1">
          <button onclick="pasteClipboard()" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-colors" title="Pegar"><i class="fa-regular fa-clipboard"></i></button>
          <button onclick="clearInput()" class="p-2 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-xl transition-colors" title="Borrar"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
    </div>

    <!-- Opciones Normales (Se ocultan si son fotos) -->
    <div id="qualityOptions" class="space-y-4">
      <p class="text-xs font-bold text-slate-400 uppercase tracking-widest text-center">Selecciona Formato</p>
      
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <button onclick="startDownload('1080')" class="bg-slate-800 hover:bg-indigo-600 border border-slate-700 p-4 rounded-2xl flex flex-col items-center gap-2 transition-all active:scale-95">
          <i class="fa-solid fa-film text-2xl text-indigo-400"></i>
          <span class="text-sm font-bold">Video HD</span>
        </button>

        <button onclick="startDownload('480')" class="bg-slate-800 hover:bg-blue-600 border border-slate-700 p-4 rounded-2xl flex flex-col items-center gap-2 transition-all active:scale-95">
          <i class="fa-solid fa-mobile-screen text-2xl text-blue-400"></i>
          <span class="text-sm font-bold">Normal</span>
        </button>

        <button onclick="startDownload('audio')" class="bg-slate-800 hover:bg-emerald-600 border border-slate-700 p-4 rounded-2xl flex flex-col items-center gap-2 transition-all active:scale-95">
          <i class="fa-solid fa-music text-2xl text-emerald-400"></i>
          <span class="text-sm font-bold">Solo Audio</span>
        </button>
      </div>
    </div>

    <!-- INTERFAZ DE CARRUSEL DE FOTOS (Oculta por defecto) -->
    <div id="carouselUI" class="hidden space-y-4">
      <div class="flex justify-between items-center mb-2">
        <p class="text-xs font-bold text-emerald-400 uppercase tracking-widest"><i class="fa-solid fa-images"></i> Carrusel Detectado</p>
        <button onclick="resetUI()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 py-1.5 px-3 rounded-lg transition-colors">Volver</button>
      </div>
      
      <button onclick="downloadAllImages()" id="btnDownloadAll" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition flex justify-center items-center gap-2 shadow-lg">
        <i class="fa-solid fa-download"></i> Descargar Todas (<span id="imgCount">0</span>)
      </button>

      <!-- Grilla de Imágenes -->
      <div id="imageGrid" class="grid grid-cols-2 gap-3 max-h-72 overflow-y-auto custom-scroll p-2 bg-slate-950 rounded-xl border border-slate-800">
        <!-- Las imágenes se insertan aquí con JS -->
      </div>
    </div>

    <!-- Status Area -->
    <div id="statusContainer" class="hidden mt-6">
      <div class="loader-bar mb-3" id="loaderBar"></div>
      <div id="statusText" class="text-center text-sm font-medium text-slate-300"></div>
    </div>

  </main>

  <footer class="text-center py-6">
    <p class="text-xs tracking-widest text-slate-500 uppercase">
      Desarrollado con precisión por <span class="font-black text-indigo-400">Yorlxx Dev</span>
    </p>
  </footer>

  <script>
    // ⚠️ REEMPLAZA ESTA URL POR LA TUYA DE RENDER ⚠️
    const RENDER_API_URL = "https://yorlxx-api-downloader.onrender.com";
    
    // Variable global para almacenar las imágenes detectadas
    let currentCarouselImages = [];

    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('urlInput').value = text.trim();
      } catch (err) { alert("Pégalo manualmente."); }
    }

    function clearInput() {
      document.getElementById('urlInput').value = '';
      resetUI(); // Si borra el link, restauramos todo
    }

    // Vuelve a mostrar los botones normales y oculta la galería
    function resetUI() {
      document.getElementById('carouselUI').classList.add('hidden');
      document.getElementById('qualityOptions').classList.remove('hidden');
      document.getElementById('statusContainer').classList.add('hidden');
    }

    function updateStatus(message, isError = false, isLoading = false) {
      const container = document.getElementById('statusContainer');
      const text = document.getElementById('statusText');
      const loader = document.getElementById('loaderBar');
      container.classList.remove('hidden');
      text.innerHTML = message;
      text.className = `text-center text-sm font-medium ${isError ? 'text-red-400' : 'text-slate-300'}`;
      loader.style.display = isLoading ? 'block' : 'none';
    }

    // Muestra la interfaz de galería
    function buildCarouselUI(images) {
      currentCarouselImages = images;
      
      document.getElementById('qualityOptions').classList.add('hidden');
      document.getElementById('statusContainer').classList.add('hidden');
      document.getElementById('carouselUI').classList.remove('hidden');
      document.getElementById('imgCount').innerText = images.length;

      const grid = document.getElementById('imageGrid');
      grid.innerHTML = ''; // Limpiamos la grilla anterior

      images.forEach((imgUrl, index) => {
        const div = document.createElement('div');
        div.className = 'relative group rounded-lg overflow-hidden border border-slate-700 aspect-[3/4] bg-slate-900';
        div.innerHTML = `
          <img src="${imgUrl}" class="w-full h-full object-cover" />
          <div class="absolute inset-0 bg-slate-950/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm">
             <button onclick="forceDownload('${imgUrl}', 'Foto_Yorlxx_${index+1}.jpg', true)" class="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-full shadow-lg transform hover:scale-110 transition-all" title="Descargar esta foto">
               <i class="fa-solid fa-download"></i>
             </button>
          </div>
          <span class="absolute top-2 left-2 bg-slate-950/80 text-xs font-bold px-2 py-1 rounded text-slate-300">${index + 1}</span>
        `;
        grid.appendChild(div);
      });
    }

    async function startDownload(quality) {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return updateStatus("⚠️ Ingresa un enlace primero.", true);
      
      const isTikTok = url.includes('tiktok.com');
      let finalUrl = "";
      const isAudio = quality === 'audio';
      const fileExtension = isAudio ? 'mp3' : 'mp4';

      try {
        if (isTikTok) {
          updateStatus("⏳ Procesando TikTok en el navegador...", false, true);
          const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
          const data = await res.json();
          if (!data || !data.data) throw new Error("Video no encontrado o privado");
          
          // --- DETECCIÓN DE CARRUSEL DE FOTOS ---
          if (data.data.images && data.data.images.length > 0) {
            if (isAudio) {
              // Si solo pidió el audio, ignoramos las fotos y bajamos el mp3
              await forceDownload(data.data.music, `Audio_Yorlxx_${Date.now()}.mp3`);
            } else {
              // Si pidió video, construimos la galería
              buildCarouselUI(data.data.images);
            }
            return; // Terminamos aquí, la galería maneja el resto
          }

          // Si es un video normal de TikTok
          if (isAudio) finalUrl = data.data.music;
          else if (quality === '1080' && data.data.hdplay) finalUrl = data.data.hdplay;
          else finalUrl = data.data.play;

        } else {
          // FB/IG (Backend Render)
          updateStatus("⏳ Conectando al servidor... (Puede tardar si está inactivo)", false, true);
          
          const response = await fetch(`${RENDER_API_URL}/download`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url, quality: quality })
          });
          
          const data = await response.json();
          if (!response.ok || !data.download_url) throw new Error(data.detail || "Video no accesible (podría ser privado).");
          
          finalUrl = data.download_url;
        }

        // Descarga el archivo (Video/Audio)
        await forceDownload(finalUrl, `Media_Yorlxx_${Date.now()}.${fileExtension}`);

      } catch (error) {
        updateStatus(`❌ ${error.message}`, true, false);
      }
    }

    // Función para el botón "Descargar Todas"
    async function downloadAllImages() {
      const btn = document.getElementById('btnDownloadAll');
      const originalText = btn.innerHTML;
      
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Descargando...';
      btn.disabled = true;
      btn.classList.replace('bg-indigo-600', 'bg-slate-600');

      for (let i = 0; i < currentCarouselImages.length; i++) {
        await forceDownload(currentCarouselImages[i], `Foto_Yorlxx_${i+1}_${Date.now()}.jpg`, true);
        // Pausa de medio segundo entre fotos para que el navegador no se bloquee ni corte la descarga
        await new Promise(r => setTimeout(r, 500));
      }

      btn.innerHTML = '<i class="fa-solid fa-check"></i> ¡Completado!';
      btn.classList.replace('bg-slate-600', 'bg-emerald-600');
      
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
        btn.classList.replace('bg-emerald-600', 'bg-indigo-600');
      }, 3000);
    }

    // MAGIA PARA DESCARGA DIRECTA (SIN REDIRECCIONAR)
    // Agregué el parámetro "isSilent" para que no sobreescriba los textos de la interfaz cuando bajamos fotos
    async function forceDownload(fileUrl, filename, isSilent = false) {
      if (!isSilent) updateStatus("✅ Archivo procesado. Iniciando descarga automática...", false, true);
      
      try {
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error("CORS bloqued Blob");
        
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = objectUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(objectUrl);
        
        if (!isSilent) updateStatus("✅ ¡Descarga completada con éxito!", false, false);
        
      } catch (e) {
        const a = document.createElement('a');
        a.href = fileUrl;
        a.download = filename;
        a.target = "_parent"; 
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        if (!isSilent) updateStatus("✅ ¡Descarga iniciada!", false, false);
      }
    }
  </script>
</body>
</html>
